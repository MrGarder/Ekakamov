<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление семьей | Ekakamov</title>

    <style>

        body{
            background:#050505;
            color:white;
            font-family:sans-serif;
            padding:20px;
        }

        .container{
            max-width:1000px;
            margin:auto;
        }

        .form-card{
            background:#111;
            border:1px solid #8b0000;
            border-radius:12px;
            padding:20px;
            margin-bottom:30px;
        }

        h2{
            color:#ff0000;
            text-align:center;
            text-transform:uppercase;
        }

        input,
        select,
        button{
            padding:10px;
            margin:5px;
            border-radius:6px;
            border:1px solid #333;
            background:#000;
            color:white;
        }

        .btn-add{
            width:100%;
            background:#8b0000;
            border:none;
            cursor:pointer;
            font-weight:bold;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:#111;
            overflow:hidden;
            border-radius:12px;
        }

        th,
        td{
            padding:12px;
            border-bottom:1px solid #222;
        }

        th{
            background:#8b0000;
        }

        .warn-btn{
            background:#222;
            border:1px solid #444;
            cursor:pointer;
            padding:4px 10px;
        }

        .warn-btn:hover{
            background:red;
        }

        .btn-edit{
            background:#2196F3;
            border:none;
            cursor:pointer;
        }

        .btn-del{
            background:#f44336;
            border:none;
            cursor:pointer;
        }

        .btn-open{
            background:#444;
            border:none;
            cursor:pointer;
        }

        .status-online{
            color:lime;
        }

        .status-offline{
            color:red;
        }

        .warn-count{
            color:gold;
            font-weight:bold;
            display:inline-block;
            width:25px;
            text-align:center;
        }

        .avatar{
            width:42px;
            height:42px;
            border-radius:50%;
            object-fit:cover;
            border:1px solid #444;
        }

        .user-box{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .rank-badge{
    padding:6px 12px;
    border-radius:6px;
    font-weight:bold;
    font-size:11px;
    text-transform:uppercase;
    display:inline-block;
}

.rank-1{
    background:#555;
    color:#ccc;
}

.rank-2{
    background:#888;
    color:#000;
}

.rank-3{
    background:#444;
    color:#fff;
}

.rank-4{
    background:#006400;
    color:#fff;
}

.rank-5{
    background:#00008b;
    color:#fff;
}

.rank-6{
    background:#4b0082;
    color:#fff;
}

.rank-7{
    background:#ffd700;
    color:#000;
}

.rank-8{
    background:#ff8c00;
    color:#fff;
}

.rank-9{
    background:#8b0000;
    color:#fff;
}

.rank-10{
    background:#ff0000;
    color:#fff;
    box-shadow:0 0 10px red;
}

.rank-11{
    background:linear-gradient(45deg,#0206ff,#4400ff);
    color:#fff;
    box-shadow:0 0 15px #fff;
}
    </style>
</head>
<body>

<div class="container">

    <div class="form-card">

        <h2>Добавить / Изменить участника</h2>

        <div style="display:flex;flex-wrap:wrap;justify-content:center;">

            <input
                type="password"
                id="pass"
                placeholder="Пароль админа"
                style="width:95%;"
            >

            <input
                type="text"
                id="name"
                placeholder="Ник игрока"
            >

            <select id="rank">

                <option value="[11] Разработчик">
                    Разработчик [11]
                </option>

                <option value="[10] Глава">
                    Глава [10]
                </option>

                <option value="[9] Зам. Главы">
                    Зам. Главы [9]
                </option>

                <option value="[8] Гольд">
                    Гольд [8]
                </option>

                <option value="[7] Шерх">
                    Шерх [7]
                </option>

                <option value="[6] Элит">
                    Элит [6]
                </option>

                <option value="[5] Ветеран">
                    Ветеран [5]
                </option>

                <option value="[4] Боец">
                    Боец [4]
                </option>

                <option value="[3] Новичок+">
                    Новичок+ [3]
                </option>

                <option value="[2] Равк">
                    Равк [2]
                </option>

                <option value="[1] Кандидат">
                    Кандидат [1]
                </option>

            </select>

            <input
                type="number"
                id="warns"
                value="0"
                placeholder="Выговоры"
                style="width:90px;"
            >

            <select id="online">

                <option value="false">
                    Оффлайн
                </option>

                <option value="true">
                    В игре
                </option>

            </select>

            <button
                class="btn-add"
                onclick="saveMember()"
            >
                СОХРАНИТЬ В БАЗУ
            </button>

        </div>

    </div>

    <h2>Текущий состав</h2>

    <table id="memberTable">

        <thead>

        <tr>
            <th>Игрок</th>
            <th>Ранг</th>
            <th>Выговоры</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>

        </thead>

        <tbody></tbody>

    </table>

</div>

<script>
function getRankClass(rank){

    if(!rank){
        return "rank-1";
    }

    if(rank.includes("[11]")){
        return "rank-11";
    }

    if(rank.includes("[10]")){
        return "rank-10";
    }

    if(rank.includes("[9]")){
        return "rank-9";
    }

    if(rank.includes("[8]")){
        return "rank-8";
    }

    if(rank.includes("[7]")){
        return "rank-7";
    }

    if(rank.includes("[6]")){
        return "rank-6";
    }

    if(rank.includes("[5]")){
        return "rank-5";
    }

    if(rank.includes("[4]")){
        return "rank-4";
    }

    if(rank.includes("[3]")){
        return "rank-3";
    }

    if(rank.includes("[2]")){
        return "rank-2";
    }

    return "rank-1";
}

async function loadMembers(){

    const res = await fetch('/admin/get-members');

    let members = await res.json();

    // ДОБАВЛЯЕМ LOCALSTORAGE USERS
    for(let i = 0; i < localStorage.length; i++){

        const key = localStorage.key(i);

        if(key.startsWith("user_")){

            const user = JSON.parse(
                localStorage.getItem(key)
            );

            const exists = members.find(
                m => m.name === user.name
            );

            if(!exists){

                members.push({
                    name:user.name,
                    rank:user.rank || "[1]",
                    warns:user.warns || 0,
                    online:true,
                    avatar:user.avatar || ""
                });
            }
        }
    }

    const tbody =
        document.querySelector('#memberTable tbody');

    tbody.innerHTML = "";

  members.forEach(m => {

    if(!m.name){
        return;
    }

    m.rank =
        m.rank || "[1] Кандидат";

const localUser = JSON.parse(
    localStorage.getItem("user_" + m.name)
);

if(localUser){

    m.avatar = localUser.avatar || "";
}

        tbody.innerHTML += `

<tr>

<td>

<div class="user-box">

<img
    class="avatar"
    src="${
        m.avatar ||
        'https://i.imgur.com/6VBx3io.png'
    }"
>

<b>${m.name}</b>

</div>

</td>

<td>

<span class="
    rank-badge
    ${getRankClass(m.rank)}
">
    ${m.rank}
</span>

</td>

<td>

<button
class="warn-btn"
onclick="changeWarns('${m.name}', -1)">
-
</button>

<span class="warn-count">
${m.warns || 0}
</span>

<button
class="warn-btn"
onclick="changeWarns('${m.name}', 1)">
+
</button>

</td>

<td class="${
    m.online
    ? 'status-online'
    : 'status-offline'
}">
${
    m.online
    ? 'В игре'
    : 'Оффлайн'
}
</td>

<td>

<button
class="btn-edit"
onclick="
fillForm(
'${m.name}',
'${m.rank}',
${m.warns},
${m.online}
)">
📝
</button>

<button
class="btn-open"
onclick="openProfile('${m.name}')">
👁
</button>

<button
class="btn-del"
onclick="deleteMember('${m.name}')">
❌
</button>

</td>

</tr>

        `;
    });
}

async function changeWarns(name, delta){

    const password =
        document.getElementById('pass').value;

    if(!password){
        return alert("Введите пароль");
    }

    const res = await fetch(
        '/admin/update-warns',
        {
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                password,
                name,
                delta
            })
        }
    );

    if(res.ok){

        // LOCALSTORAGE
        const user = JSON.parse(
            localStorage.getItem("user_" + name)
        );

        if(user){

            user.warns =
                (user.warns || 0) + delta;

            if(user.warns < 0){
                user.warns = 0;
            }

            localStorage.setItem(
                "user_" + name,
                JSON.stringify(user)
            );
        }

        loadMembers();

    }else{

        alert("Ошибка");
    }
}

function fillForm(name, rank, warns, online){

    document.getElementById('name').value = name;

    document.getElementById('rank').value = rank;

    document.getElementById('warns').value = warns;

    document.getElementById('online').value =
        online.toString();

    window.scrollTo(0,0);
}

async function saveMember(){

   const localUser = JSON.parse(
    localStorage.getItem(
        "user_" +
        document.getElementById('name').value
    )
);

const data = {

    password:
        document.getElementById('pass').value,

    name:
        document.getElementById('name').value,

    rank:
        document.getElementById('rank').value,

    warns:
        parseInt(
            document.getElementById('warns').value
        ),

    online:
        document.getElementById('online').value
        === "true",

    avatar:
        localUser?.avatar || ""
};

    const res = await fetch(
        '/admin/update-member',
        {
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify(data)
        }
    );

  // LOCALSTORAGE UPDATE
let user = JSON.parse(
    localStorage.getItem("user_" + data.name)
);

if(user){

    // СОХРАНЯЕМ СТАРЫЕ ДАННЫЕ
    const oldAvatar = user.avatar || "";
    const oldDept = user.department || "";
    const oldPos = user.position || "";
    const oldXp = user.xp || 0;
    const oldLevel = user.level || 1;
    const oldTasks = user.taskStatus || {};
    const oldActivity = user.activityData || [];

    // ОБНОВЛЯЕМ
    user.rank = data.rank;
    user.warns = data.warns;
    user.online = data.online;

    // ВОЗВРАЩАЕМ ДАННЫЕ
    user.avatar = oldAvatar;
    user.department = oldDept;
    user.position = oldPos;
    user.xp = oldXp;
    user.level = oldLevel;
    user.taskStatus = oldTasks;
    user.activityData = oldActivity;

    localStorage.setItem(
        "user_" + data.name,
        JSON.stringify(user)
    );
} 

    if(res.ok){

        alert("Сохранено");

        loadMembers();

    }else{

        alert("Ошибка");
    }
}

async function deleteMember(name){

    const password =
        document.getElementById('pass').value;

    if(!password){
        return alert("Введите пароль");
    }

    if(!confirm(`Уволить ${name}?`)){
        return;
    }

    const res = await fetch(
        '/admin/delete-member',
        {
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                password,
                name
            })
        }
    );

    if(res.ok){

        localStorage.removeItem(
            "user_" + name
        );

        loadMembers();

    }else{

        alert("Ошибка удаления");
    }
}

function openProfile(name){

    localStorage.setItem(
        "viewProfile",
        name
    );

    window.open(
        "Cabinet.html",
        "_blank"
    );
}

loadMembers();

</script>

</body>
</html>
